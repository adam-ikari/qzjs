name: CI

on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # All-optional-features-OFF build: mock_libuv tests only.
  # (Named "all-features-off", NOT "minimal" — QZ_PROFILE=minimal is a
  # different thing: ECMA-429-compliant with only TLS cut. This job is the
  # bare no-features matrix.)
  # ============================================================================
  all-features-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: all-features-off
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_WITH_WAMR=OFF \
            -DQZ_WITH_TLS=OFF \
            -DQZ_WITH_CRYPTO_EXT=OFF \
            -DQZ_WITH_COMPRESS=OFF \
            -DQZ_WITH_TEXTCODEC=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # Feature matrix: independent toggles for TLS, crypto-ext, compress, textcodec.
  # WAMR is disabled across the matrix to keep builds fast; the wamr job below
  # covers WASM compliance.
  # ============================================================================
  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "tls=OFF crypto=ON"
            tls: "OFF"
            crypto_ext: "ON"
            compress: "ON"
            textcodec: "ON"
          - name: "tls=ON crypto=ON"
            tls: "ON"
            crypto_ext: "ON"
            compress: "ON"
            textcodec: "ON"
          - name: "compress=OFF"
            tls: "ON"
            crypto_ext: "ON"
            compress: "OFF"
            textcodec: "ON"
          - name: "textcodec=OFF"
            tls: "ON"
            crypto_ext: "ON"
            compress: "ON"
            textcodec: "OFF"
    name: feature (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_WITH_WAMR=OFF \
            -DQZ_WITH_TLS=${{ matrix.tls }} \
            -DQZ_WITH_CRYPTO_EXT=${{ matrix.crypto_ext }} \
            -DQZ_WITH_COMPRESS=${{ matrix.compress }} \
            -DQZ_WITH_TEXTCODEC=${{ matrix.textcodec }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # WAMR: default WASM engine with Fast JIT. This is the primary WASM path.
  # ============================================================================
  wamr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: wamr (default WASM engine, Fast JIT)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # wasm3: alternative WASM engine. Tests the fallback path remains working.
  # ============================================================================
  wasm3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: wasm3 (alternative WASM engine)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_WITH_WAMR=OFF \
            -DQZ_WITH_WASM3=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # Polyfill mode=external: bytecode loaded at runtime from
  # dist/polyfill_default.polyfill (built by polyfill/build.js Mode B).
  # Covers the external-file loader leg of QZ_POLYFILL_MODE.
  # ============================================================================
  polyfill-external:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: polyfill-external (QZ_POLYFILL_MODE=external)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill rebuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_POLYFILL_MODE=external

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline; tests get QZ_POLYFILL_FILE via test/CMakeLists.txt)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # Polyfill mode=compressed: lz4-compressed .rodata, decompressed to heap
  # at load. Exercises the vendored-lz4 compressor/decompressor pair.
  # ============================================================================
  polyfill-compressed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: polyfill-compressed (QZ_POLYFILL_MODE=compressed)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill rebuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_POLYFILL_MODE=compressed

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # Non-UTF encodings: QZ_WITH_NONUTF_ENCODINGS=ON adds Latin-1/replacement
  # labels to TextDecoder and rebuilds the polyfill with them enabled.
  # ============================================================================
  nonutf-encodings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: nonutf (QZ_WITH_NONUTF_ENCODINGS=ON)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill rebuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DQZ_WITH_NONUTF_ENCODINGS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # QZ_PROFILE=minimal: ECMA-429-compliant build with only TLS cut. README's
  # advertised variant — must actually compile + pass offline tests. Gated
  # here so a broken minimal build surfaces in CI, not on user's machine.
  # ============================================================================
  profile-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: profile=minimal (ECMA-429, TLS off)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_PROFILE=minimal \
            -DQZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # Sanitizers: ASan + UBSan with WAMR default engine.
  # ============================================================================
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "default (WAMR, all features)"
            wamr: "ON"
          - name: "minimal (all features OFF)"
            wamr: "OFF"
    name: asan (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (ASan)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            ${{ matrix.wamr == 'ON' && '-DQZ_WITH_WAMR=ON' || '-DQZ_WITH_WAMR=OFF -DQZ_WITH_TLS=OFF -DQZ_WITH_CRYPTO_EXT=OFF -DQZ_WITH_COMPRESS=OFF -DQZ_WITH_TEXTCODEC=OFF' }} \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build --parallel

      # tests=ON 的库就在上面那个 ASan 构建里，顺手查一遍「声明面 vs 链接面」——
      # mock 档的 ping 家族守卫问题只有这一档能看见（QZ_USE_MOCK_LIBUV 曾经是
      # PRIVATE，消费者看不到，守卫的 mock 那半边等于没写）。
      - name: API surface check (mock build)
        run: python3 test/api_surface_check.py --build-dir build --model mock

      - name: Test (offline, ASan + leak detection)
        env:
          # GCC 13+ ASan 默认开 detect_stack_use_after_return（假栈）：WAMR 栈
          # 边界检测用局部变量地址比对真实栈底，假栈在堆上、地址更低 → 所有
          # wasm 调用误报 "native stack overflow"。关 UAR 假栈（其余检测不变），
          # gcc-12 UAR=1/0 双向复现（2026-09-09）。
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0
        run: ctest -L offline --output-on-failure
        working-directory: build

      # M-P7 邮箱路径的 ASAN 覆盖。上面的 ASAN 构建开了 QZ_BUILD_TESTS=ON，
      # 而 src/ipc_process.c 与 src/rt_host.c 在该配置下整文件不编（mock 后端
      # 没有 uv_pipe）——全项目最并发的一段代码（邮箱 MPSC、eventfd 唤醒、
      # 三级终止、崩溃帧时序）就这么从没有过 ASAN 覆盖。qz_mp7_mailbox_e2e
      # harness 依赖真实 ISOLATED 后端，故另起一个 tests=OFF 的构建跑它。
      # 六模式在 ASAN + LSan 下均实测无泄漏。
      - name: Configure (ASan, real ISOLATED backend)
        run: |
          cmake -B build-asan-rt -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_PROCESS_MODEL=ISOLATED \
            ${{ matrix.wamr == 'ON' && '-DQZ_WITH_WAMR=ON' || '-DQZ_WITH_WAMR=OFF -DQZ_WITH_TLS=OFF -DQZ_WITH_CRYPTO_EXT=OFF -DQZ_WITH_COMPRESS=OFF -DQZ_WITH_TEXTCODEC=OFF' }} \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build (ASan, real ISOLATED backend)
        run: cmake --build build-asan-rt --parallel

      - name: Test M-P7 mailbox e2e (ASan + leak detection)
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0
        run: bash test/test_mp7_mailbox_e2e.sh ./build-asan-rt/qzjs

      # LSan 只在**正常退出**的 atexit 里跑检查——被 SIGTERM 收掉的进程一封报告都
      # 不出。所以「ASAN 跑过了」对 kill 型 e2e 脚本是空的：ctl / nested 两支都
      # 用 kill -TERM 收宿主，宿主侧的泄漏它们永远看不到。mp7 的 harness 从 main
      # 正常返回，泄漏检查是真的；控制面这条路径另配一个自己建运行时、自己
      # 正常退出的探针（它抓到过 qz_control_endpoint_cmd 的 path 前投早返回漏
      # buf + correl，共 86B）。
      - name: Test CTL-2 endpoint leak probe (ASan + LSan, normal exit)
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0
        run: ./build-asan-rt/qz_ctl_endpoint_leak_probe

      # 端点**拒收路径**的帧级判据。必须逐帧用真 JSON 解析器：这两条拒收回帧
      # 第一版里的 -3 帧是**非法 JSON**（C 记法 \" 只让字符串里出现裸引号，拼进
      # JSON 在第 53 列截断 error 串），而 qzjs-ctl 用 strstr 判断成败、从不解析
      # JSON，所以 e2e 与 ctl 脚本全都抓不到——只有 cJSON_Parse 会红。同一探针还
      # 锁住「帧尾多带 \n 会多出空帧」「前投无此槽位要当场 NOT_FOUND」「interrupt
      # 不带 correl 不得被拒」三条。
      - name: CTL-2 reject frames are valid JSON (ASan + LSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0
        run: ./build-asan-rt/qz_ctl_reject_frames_probe

  # ============================================================================
  # ubsan: undefined behavior sanitizer, gcc + clang matrix.
  # ============================================================================
  ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build clang

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (UBSan)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline, UBSan)
        run: ctest -L offline --output-on-failure
        working-directory: build

      # 同一个结构性缺口，同 ASAN job：上面那个 UBSan 构建开了 QZ_BUILD_TESTS=ON，
      # 而 src/ipc_process.c 与 src/rt_host.c 在该配置下整文件不编（mock 后端没有
      # uv_pipe）——邮箱 MPSC / eventfd 唤醒 / 三级终止 / 崩溃帧时序 / ping 退避这些
      # 最吃 UB（指针算术、size 溢出、原子配对）的一段代码，从没有在 UBSan 下跑过。
      # 另起一个 tests=OFF 的真实 ISOLATED 构建，跑并发最密的那支 e2e。
      - name: Configure (UBSan, real ISOLATED backend)
        run: |
          cmake -B build-ubsan-rt -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_PROCESS_MODEL=ISOLATED \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined"

      - name: Build (UBSan, real ISOLATED backend)
        run: cmake --build build-ubsan-rt --parallel

      - name: Test M-P7 mailbox e2e (UBSan, real ISOLATED backend)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash test/test_mp7_mailbox_e2e.sh ./build-ubsan-rt/qzjs

  # ============================================================================
  # Release build: WAMR default, optimised.
  # ============================================================================
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: release build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline)
        run: |
          ctest -L offline --output-on-failure
        working-directory: build

  # ============================================================================
  # HTTPServer performance: wrk against the pure-JS serve() implementation.
  # Baseline (2026-08-24, I7-class container): tiny 12.6k rps / small 3.1k /
  # medium-16KB 256 / post 10.5k. Thresholds are 50% of baseline to catch
  # regressions without being flaky on shared CI runners.
  # ============================================================================
  httpserver-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: httpserver perf (wrk)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build wrk

      - name: Install Node (polyfill build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (Release, real-libuv CLI)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_WITH_TLS=ON

      - name: Build qjsc (polyfill bytecode compiler)
        run: cmake --build build --target qjsc

      - name: Rebuild polyfill (ensure dist in sync)
        run: |
          QJSC=$PWD/build/deps/quickjs-ng/qjsc npm --prefix polyfill run build

      - name: Build
        run: cmake --build build --parallel

      - name: Benchmark serve() with wrk
        run: |
          python3 test/bench_httpserver.py --qzjs-bin ./build/qzjs --duration 5 \
            | tee /tmp/perf.out
          python3 - <<'EOF'
          import json, re, sys
          txt = open('/tmp/perf.out').read()
          # last line holds the JSON summary
          data = json.loads(txt.strip().splitlines()[-1])
          thresholds = {
              'tiny':   6300,   # 50% of 12601
              'small':  1570,   # 50% of 3141
              'medium': 128,    # 50% of 256
              'post':   5265,   # 50% of 10530
          }
          failed = []
          for name, thr in thresholds.items():
              rps = data.get(name, {}).get('rps') or 0
              print('%s rps=%.0f (threshold %.0f) %s' % (
                  name, rps, thr, 'OK' if rps >= thr else 'LOW'))
              if rps < thr:
                  failed.append('%s=%.0f<thr=%.0f' % (name, rps, thr))
              if data.get(name, {}).get('errors', 0) > 0:
                  failed.append('%s-errors=%d' % (name, data[name]['errors']))
          if failed:
              print('PERF-REGRESSION: ' + ', '.join(failed))
              sys.exit(1)
          print('PERF-OK')
          EOF

  # ============================================================================
  # HTTP/2 client stack perf (pure JS protocol stack, Node transport shim).
  # ============================================================================
  h2-client-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: h2-client perf (JS stack)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Benchmark HTTP/2 client stack
        run: |
          node test/bench_h2_client.mjs --duration 5 \
            | tee /tmp/h2-perf.out
          python3 - <<'EOF'
          import json, sys
          txt = open('/tmp/h2-perf.out').read()
          data = json.loads(txt.strip().splitlines()[-1])
          thresholds = {
              'tiny':      2300,   # 50% of ~4600
              'small':     2400,   # 50% of ~4800
              'medium':    1800,   # 50% of ~3600
              'multiplex': 7000,   # 50% of ~14000
          }
          failed = []
          for name, thr in thresholds.items():
              rps = data.get(name, {}).get('rps') or 0
              print('%s rps=%.0f (threshold %.0f) %s' % (
                  name, rps, thr, 'OK' if rps >= thr else 'LOW'))
              if rps < thr:
                  failed.append('%s=%.0f<thr=%.0f' % (name, rps, thr))
          if failed:
              print('PERF-REGRESSION: ' + ', '.join(failed))
              sys.exit(1)
          print('PERF-OK')

  # ============================================================================
  # Runtime performance: worker spawn / IPC / eval / memory (R1-R6), driven by
  # test/bench_runtime.py across both worker backends (THREAD in-process,
  # PROCESS fork+exec). Record-only — no thresholds: the numbers are compared
  # against the judgment table in
  # docs/plans/2026-09-04-runtime-perf-benchmark-design.md, and the design
  # explicitly expects empirical revision of that table. continue-on-error
  # keeps a noisy runner from blocking merges; the JSON is archived for
  # trend tracking. --quick keeps the sample counts small (R2 must stay
  # <=16 worker slots on THREAD; PROCESS R3/R4 are batched around the worker
  # drop-out bug).
  # A measurement that hits the known worker hang is recorded as null (meta.
  # skipped) and reported as SKIP — the JSON is still written, and the bench
  # step fails only if the artifact is missing entirely.
  # ============================================================================
  runtime-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: runtime perf (workers)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill build)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (Release, real-libuv CLI)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_WITH_TLS=ON

      - name: Build qjsc (polyfill bytecode compiler)
        run: cmake --build build --target qjsc

      - name: Rebuild polyfill (ensure dist in sync)
        run: |
          QJSC=$PWD/build/deps/quickjs-ng/qjsc npm --prefix polyfill run build

      - name: Build
        run: cmake --build build --parallel

      - name: Benchmark runtime (both worker backends)
        run: |
          set -o pipefail
          python3 test/bench_runtime.py --qzjs-bin ./build/qzjs --quick \
            --json /tmp/runtime-perf.json | tee /tmp/runtime-perf.out
          if [ ! -f /tmp/runtime-perf.json ]; then
            echo "::error::bench_runtime.py produced no /tmp/runtime-perf.json"
            exit 1
          fi

      - name: Summarize
        run: |
          python3 - <<'EOF'
          import json
          # The benchmark step asserts this file exists; individual metrics
          # may still be null when a measurement was skipped (flaky worker
          # hang) — print SKIP instead of crashing.
          d = json.load(open('/tmp/runtime-perf.json'))

          def val(v, scale=1.0, spec='%.2f'):
              return 'SKIP' if v is None else spec % (v * scale)

          print('startup      median=%s ms'
                % val(d['startup_ms'].get('median_ms')))
          sp = d['spawn']['ready_us']
          print('spawn ready  thread=%s ms process=%s ms ratio=%s'
                % (val(sp.get('thread'), 0.001), val(sp.get('process'), 0.001),
                   val(sp.get('ratio'))))
          for p in ('0', '1024', '65536'):
              r = d['roundtrip'][p]
              print('roundtrip %-6s thread=%s us process=%s us ratio=%s'
                    % (p,
                       val(r.get('thread_us', {}).get('median_us'), 1.0, '%8.1f'),
                       val(r.get('process_us', {}).get('median_us'), 1.0, '%8.1f'),
                       val(r.get('ratio'))))
          t = d['throughput']
          print('throughput   thread=%s msg/s process=%s msg/s ratio=%s'
                % (val(t.get('thread', {}).get('median_msgps'), 1.0, '%.0f'),
                   val(t.get('process', {}).get('median_msgps'), 1.0, '%.0f'),
                   val(t.get('ratio'))))
          e = d['eval']
          print('eval         int=%s closure=%s str=%s M ops/s'
                % (val(e.get('int_mops')), val(e.get('closure_mops')),
                   val(e.get('str_mops'))))
          sk = d.get('meta', {}).get('skipped') or []
          print('skipped      %s' % ('; '.join(sk) if sk else 'none'))
          EOF

      - name: Upload perf JSON
        uses: actions/upload-artifact@v4
        with:
          name: runtime-perf-json
          path: /tmp/runtime-perf.json

  # ============================================================================
  # Cross-runtime performance: qzjs vs node vs bun (R1 cold start / R6 eval /
  # R5 peak RSS), driven by test/bench_cross_runtime.py with the shared
  # test/bench/runtime/bench-eval-cross.js. Per the test-env policy (design doc
  # §0) benchmarks run in CI only — local numbers are one-off history, the
  # authoritative baseline comes from this job. tjs is excluded: building it
  # needs gcc-12 + mbedtls submodule + a patch (design doc §8.4). No polyfill
  # rebuild — bench_cross_runtime.py only needs build/qzjs (polyfill embedded
  # at compile time from the committed src/polyfill_default.c) plus the
  # committed dist and bench-eval-cross.js, so no npm ci / qjsc step (lesson
  # from the runtime-perf qjsc-order failures). continue-on-error: observe-only.
  cross-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: cross-runtime perf (qzjs/node/bun)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (pinned for baseline reproducibility)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (Release, real-libuv CLI)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_WITH_TLS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Benchmark cross-runtime (qzjs/node/bun)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          python3 test/bench_cross_runtime.py \
            --bins "qzjs=./build/qzjs,node=$(which node),bun=$(which bun)" \
            --quick --json /tmp/cross-runtime.json | tee /tmp/cross-runtime.out

      - name: Summarize
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('/tmp/cross-runtime.json'))
          for name in ('qzjs', 'node', 'bun'):
              r = d['runtimes'].get(name)
              if not r:
                  print('%s: (no data)' % name)
                  continue
              print('%s: r1=%.2f ms  int=%.2f closure=%.2f str=%.2f M ops/s  rss=%s KB'
                    % (name, r['r1']['median_ms'], r['eval']['int_mops'],
                       r['eval']['closure_mops'], r['eval']['str_mops'],
                       r['peak_rss_kb']))
          for name, v in d.get('vs_am', {}).items():
              print('%s vs qzjs: r1=%.2fx int=%.2fx rss=%.2fx'
                    % (name, v['r1_x'], v['int_mops_x'], v['peak_rss_kb_x']))
          EOF

      - name: Upload perf JSON
        uses: actions/upload-artifact@v4
        with:
          name: cross-runtime-json
          path: /tmp/cross-runtime.json

  # ============================================================================
  # JS-API perf: test/bench_js_api.mjs (streams / crypto / compress / fs / wasm)
  # across qzjs / node / bun. Record-only — no thresholds; first run establishes
  # a baseline. qzjs runs with --iters 0.25 (interpreter) and a long timeout.
  # ============================================================================
  js-api-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: js-api perf (streams/crypto/compress/fs/wasm × qzjs/node/bun)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill build + bench driver)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (Release, real-libuv CLI)
        run: |
          cmake -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DQZ_BUILD_TESTS=OFF             -DQZ_WITH_TLS=ON

      - name: Build (polyfill rebuild via build.js + qjsc)
        run: cmake --build build --parallel

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Benchmark JS API (all modes, all runtimes)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          set -x
          for rt in qzjs node bun; do
            bin="$([ $rt = qzjs ] && echo ./build/qzjs || (which $rt))"
            timeout 1200 "$bin" test/bench_js_api.mjs --mode all               --iters $([ $rt = qzjs ] && echo 0.25 || echo 1.0)               | tee /tmp/js-api-$rt.out
          done

      - name: Summarize
        run: |
          python3 - <<'EOF'
          import json, os
          for rt in ('qzjs', 'node', 'bun'):
              path = '/tmp/js-api-%s.out' % rt
              if not os.path.exists(path):
                  print('%s: (no data)' % rt)
                  continue
              try:
                  line = [l for l in open(path).read().strip().splitlines() if l.strip()][-1]
                  d = json.loads(line)
                  print('%s: %s' % (rt, ' '.join('%s=%s' % (k, v) for m, vs in d.items() if m not in ('js_api_bench','date') for k, v in (vs.items() if isinstance(vs, dict) else [(m, vs)]))))
              except Exception as e:
                  print('%s: parse error %s' % (rt, e))
          EOF

      - name: Compare vs baseline (Δ% per metric)
        run: |
          for rt in qzjs node bun; do
            [ -f /tmp/js-api-$rt.out ] || { echo "$rt: (no output)"; continue; }
            echo "--- $rt ---"
            python3 test/compare_perf.py \
              --baseline test/perf_baselines/js-api.json \
              --out /tmp/js-api-$rt.out --section $rt || true
          done

      - name: Upload perf JSON
        uses: actions/upload-artifact@v4
        with:
          name: js-api-perf-json
          path: |
            /tmp/js-api-*.out

  # ============================================================================
  # TLS / WS / gRPC perf: record-only server benches (qzjs-native, CI-only).
  # ============================================================================
  tls-ws-grpc-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: tls/ws/grpc perf (record-only)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build wrk

      - name: Install Node (polyfill build + ws client)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (Release, CLI + TLS + gRPC)
        run: |
          cmake -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DQZ_BUILD_TESTS=OFF             -DQZ_WITH_TLS=ON             -DQZ_WITH_GRPC=ON

      - name: Build (polyfill rebuild via build.js + qjsc)
        run: cmake --build build --parallel

      - name: Benchmark TLS server (wrk)
        run: |
          python3 test/bench_tls_server.py --backend qzjs --qzjs-bin ./build/qzjs --duration 5             | tee /tmp/tls.out

      - name: Benchmark WebSocket echo (node client)
        run: |
          node test/bench_ws_server.mjs --qzjs-bin ./build/qzjs --messages 1000 --connections 1             | tee /tmp/ws.out
          node test/bench_ws_server.mjs --qzjs-bin ./build/qzjs --messages 1000 --connections 8             | tee /tmp/ws-8.out

      - name: Benchmark gRPC unary (qzjs client -> qzjs server)
        run: |
          python3 test/bench_grpc_unary.py --qzjs-bin ./build/qzjs --calls 2000             | tee /tmp/grpc.out

      - name: Summarize
        run: |
          python3 - <<'EOF'
          import json, os
          for label, path in (('tls', '/tmp/tls.out'), ('ws', '/tmp/ws.out'),
                              ('ws-8', '/tmp/ws-8.out'), ('grpc', '/tmp/grpc.out')):
              if not os.path.exists(path):
                  print('%s: (no data)' % label)
                  continue
              try:
                  line = [l for l in open(path).read().strip().splitlines() if l.strip()][-1]
                  print('%s: %s' % (label, line))
              except Exception as e:
                  print('%s: parse error %s' % (label, e))
          EOF

      - name: Compare vs baseline (Δ% per metric)
        run: |
          for sec in tls ws ws-8 grpc; do
            [ -f /tmp/$sec.out ] || { echo "$sec: (no output)"; continue; }
            echo "--- $sec ---"
            python3 test/compare_perf.py \
              --baseline test/perf_baselines/tls-ws-grpc.json \
              --out /tmp/$sec.out --section $sec || true
          done

      - name: Upload perf JSON
        uses: actions/upload-artifact@v4
        with:
          name: tls-ws-grpc-perf-json
          path: |
            /tmp/tls.out
            /tmp/ws.out
            /tmp/ws-8.out
            /tmp/grpc.out
  # ============================================================================
  # e2e: real-libuv CLI (QZ_BUILD_TESTS=OFF) driving the four standalone e2e
  # suites plus the pure-JS verification harnesses (node only, no C build).
  # Mock-libuv builds (QZ_BUILD_TESTS=ON) have no real networking — the CLI
  # there cannot serve()/fetch(), hence the dedicated tests=OFF configure.
  # ============================================================================
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: e2e (real-libuv CLI + JS harnesses)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (harnesses + polyfill esbuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (real-libuv CLI)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      # examples/ 编译进 CI：这 14 个示例目标（3 个 C 程序 hello/worker/messages
      # + 11 个 qjsc JS 编译检查）此前从不被任何 job 编译，公共 API
      # 一变就集体腐烂，只有用户亲手构建时才发现。下面再实跑三个邮箱宿主示例
      # ——它们是 M-P7 邮箱契约的 dogfood（零回调、零 libuv，消费全走
      # qz_recv_message），编译过不代表跑得对。
      - name: Examples — mailbox host contract smoke (M-P7 dogfood)
        run: |
          ./build/examples/hello/qz_hello
          ./build/examples/messages/qz_messages
          ./build/examples/worker/qz_worker

      # 文档 C 片段编译门：把 docs/ + README 的 ```c 块真的编译一遍。文档腐化
      # 是完全静默的——公共 API 改个名字、示例少个 include、把返回值语义写反，
      # 文档照旧发布、用户照抄照踩（M-P7 评审里的 qz_get_jsctx 根本不存在、
      # qz_post_message 长度字面量 26、event-loop 第 3 步不回流，都是这么活下来
      # 的）。只留 -Werror=implicit-function-declaration 这一类真会挡住腐化的诊断，
      # 未用参数/缩进不算错。当前 99/99 全过，--ratchet 保证不再倒退。
      - name: Docs C snippets compile
        run: python3 test/docs_c_snippet_check.py --ratchet

      # 站内链接与锚点：VitePress 对指向已改名/已删章节的链接**不报错**，页面照常
      # 生成，只是那个 #anchor 永远滚不到东西。读者点过去落在页顶就以为文档没写。
      # slug 规则里 `&` 被去掉但两侧空格保留，`## Workers & the Process Model`
      # → `workers--the-process-model`（双连字符），这是最容易写错的一类。
      - name: Docs internal links and anchors
        run: python3 test/docs_link_check.py

      # fuzz 语料里的 seed-polyfill-head*.bc / seed-workerboot.bc 是「构建产出的
      # 字节码（dist/*.bytecode）的头 N 字节」，现已改为**随构建重新生成**
      # （test/gen_fuzz_seeds.py，挂 qzjs 的 fuzz_seeds_gen 目标；本 job 走 qzjs
      # 默认 target 故自动触发）。它们曾 committed，但内嵌字节码由 qjsc 构建期
      # 生成且逐位不可复现（同源码两次构建可有数字节差异），committed 种子永远
      # 匹配不上某次构建的字节码——这道门因此恒红。现种子与字节码同批生成，门恒
      # 成立，同时仍守住真正要防的事：种子必须是内嵌字节码的真实前缀，fuzz 的 60
      # 秒预算才是在真实字节码结构附近变异，而非一个已不存在的形态。
      - name: Fuzz corpus seeds match the built bytecode
        run: python3 test/fuzz_corpus_align_check.py

      # 第三方依赖登记完整性。MIT/Apache 的分发义务要求版权声明随二进制走；
      # 新增 vendored 依赖或 polyfill npm 依赖时若漏登记 THIRD_PARTY_NOTICES.md
      # = 合规风险。这条约束已被实际漂移验证过（cJSON 与三个 polyfill npm 依赖
      # 曾漏登记），故把校验固化成门。
      - name: Third-party notices cover all vendored deps
        run: python3 test/third_party_notices_check.py

      # 公共头声明面 vs 实际链接面。「声明了但某个编译模型下没有实现」是最难查
      # 的一类缺陷：宿主编译通过（头无条件声明），直到链接才炸出一句
      # undefined reference，看起来像构建坏了而不是「这个模型没这个功能」。
      # qz_ping / qz_ping_path 就是这样（实现在 src/rt_host.c，仅 ISOLATED +
      # 非 test 编译，声明却无条件）。ISOLATED 侧用上面已构建的 build/，THREAD
      # 侧另起一个只编静态库的构建（--target qzjs，比全量快得多）。
      - name: Configure (THREAD, library only)
        run: |
          cmake -B build-thread -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_PROCESS_MODEL=THREAD

      - name: Build (THREAD, library only)
        run: cmake --build build-thread --target qzjs --parallel

      # mock 一档查的是「测试构建」：ping 家族的守卫含 !defined(QZ_USE_MOCK_LIBUV)，
      # 而该宏曾是 PRIVATE、消费者看不见，那半个守卫形同虚设——头里声明 qz_ping、
      # 库里没有，「编译过、链接炸」在测试构建里原样复现。只查前两档看不见它。
      # 这一步跑 isolated/thread 两档；第三档 mock 在 asan job（那儿才有 tests=ON
      # 的库）。本地 make gates 三档都跑。
      - name: API surface matches link surface (isolated + thread; mock in asan job)
        run: |
          python3 test/api_surface_check.py --build-dir build --model isolated
          python3 test/api_surface_check.py --build-dir build-thread --model thread

      - name: JS harnesses (hpack / protobuf / h2-client / grpc)
        run: |
          node test/hpack_harness.mjs
          node test/protobuf_harness.mjs
          node test/h2_client_harness.mjs
          node test/grpc_harness.mjs

      - name: e2e — HTTPServer / fetch proxy
        run: |
          python3 test/test_httpserver_e2e.py --qzjs-bin ./build/qzjs
          python3 test/test_fetch_proxy_e2e.py --qzjs-bin ./build/qzjs

      - name: e2e — Service Worker (SW-0 / SW-1 / SW-2)
        run: |
          bash test/service_worker_e2e.sh ./build/qzjs
          bash test/service_worker_sw1_e2e.sh ./build/qzjs
          bash test/service_worker_sw2_e2e.sh ./build/qzjs

      # 多进程模型（缺省 ISOLATED）：宿主↔主RT 进程分离 + 双后端 worker parity。
      - name: e2e — multi-process (M-P1 worker / M-P2 host↔mainRT split / M-P3 MessagePort / M-P4 storage+crash / M-R2 composition)
        run: |
          bash test/test_mp1_process_e2e.sh ./build/qzjs
          bash test/test_mp2_host_split_e2e.sh ./build/qzjs
          bash test/test_mp3_port_e2e.sh ./build/qzjs
          bash test/test_mp4_storage_crash_e2e.sh ./build/qzjs
          bash test/test_mr2_composition_e2e.sh ./build/qzjs

      # M-P7：邮箱宿主契约（库零回调；宿主经 qz_recv_message/qz_message_fd 消费）。
      - name: e2e — mailbox host contract (M-P7)
        run: |
          bash test/test_mp7_mailbox_e2e.sh ./build/qzjs

      # 宿主**照文档写出来的**消费循环能不能用。既有 e2e 的 harness 都是测试专用
      # 宿主、各自验一条断言；宿主真正会做的事（按 docs/c-api/runtime.md 邮箱节那段
      # 循环收发）此前无人验，而文档门只保证那段代码能编、不保证它行为正确。三条路径：
      # 文档循环原样 / 宿主自己的 eventfd（qz_message_fd）交接 / wait_idle 后排干。
      # 脚本末尾另有一道防漂移检查：文档与程序对库错误帧必须用同一条判别式。
      - name: e2e — host consumption contract (as documented)
        run: |
          bash test/test_host_contract_e2e.sh ./build/qzjs

      # 控制面 CTL-1/CTL-2（本地端点 + 信封 CONTROL 树路由到 worker）。
      - name: e2e — control plane (CTL-1 tree routing / CTL-2 endpoint + qzjs-ctl)
        run: |
          bash test/test_ctl_e2e.sh ./build/qzjs ./build/qzjs-ctl

      # 嵌套 spawn（N-P1..N-P4）：worker 内再 spawn 孙 + §8.2 path 链路由 +
      # CTL path 寻址到孙 + STORAGE 两级中继 + §9.4 两级死亡级联。
      - name: e2e — nested spawn (worker→grandchild / §8.2 path routing / CTL path / nested STORAGE / cascade death)
        run: |
          bash test/test_nested_e2e.sh ./build/qzjs ./build/qzjs-ctl


  # ============================================================================
  # grpc-e2e: QZ_WITH_GRPC=ON real binary — the embedded gRPC stack only
  # exists in ON bundles (default OFF), so the TLS server e2e (unary +
  # streaming family) runs nowhere else. Polyfill rebuild (build.js + qjsc)
  # happens inside the CMake build via the grpcON stamp.
  # ============================================================================
  grpc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: grpc-e2e (QZ_WITH_GRPC=ON + TLS streaming)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (harnesses + polyfill esbuild)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci

      - name: Configure (QZ_WITH_GRPC=ON)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_WITH_GRPC=ON

      - name: Build (polyfill rebuild via build.js + qjsc)
        run: cmake --build build --parallel

      - name: Install gRPC peer modules (grpc-js + proto-loader)
        run: npm install --prefix /tmp/grpcpeer @grpc/grpc-js @grpc/proto-loader

      - name: gRPC server e2e (real binary over TLS — unary + streaming family)
        run: |
          node test/grpc_server_tls_e2e.mjs --qzjs-bin ./build/qzjs
          node test/grpc_server_harness.mjs
  # ============================================================================
  # Coverage: gcov with WAMR default engine.
  # ============================================================================
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: coverage (gcov)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build lcov

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (Coverage)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic -g -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (offline, coverage)
        run: ctest -L offline --output-on-failure
        working-directory: build

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --rc lcov_branch_coverage=1 \
            --exclude '*/deps/*' --exclude '*/test/*' \
            --ignore-errors unused
          lcov --summary coverage.info 2>&1 | tee lcov_summary.txt
          # Line-coverage floor: first baseline 50% (measured 53.7% on
          # 2026-09-12); tighten as coverage grows.
          PCT=$(sed -n 's/.*lines\.*: \([0-9.]*\)%.*/\1/p' lcov_summary.txt | head -1)
          echo "line coverage: ${PCT}%"
          awk -v p="$PCT" 'BEGIN { exit (p+0 >= 50.0) ? 0 : 1 }' || {
            echo "::error::line coverage ${PCT}% is below the 50% floor"; exit 1; }

  # ============================================================================
  # Debugger: applies the QuickJS-ng patch and runs DAP tests.
  # ============================================================================
  debugger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: debugger (DAP)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_DEBUGGER=ON \
            -DQZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (dap)
        run: ctest -L dap --output-on-failure
        working-directory: build

      # 扩展 e2e 以真二进制为被调试端（adapter 内联 DAP 客户端），
      # 默认找 build_dbg/qzjs——CI 本 job 的构建目录是 build/，用
      # QZJS_RUNTIME 覆盖（docs/dev/debugging.md Test 节有记载）。
      - name: Install Node (extension e2e)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install extension deps
        run: npm --prefix vscode/qzjs-debug ci

      - name: Test (extension e2e)
        run: |
          npm --prefix vscode/qzjs-debug run compile
          QZJS_RUNTIME=$PWD/build/qzjs npm --prefix vscode/qzjs-debug test

  # ============================================================================
  # test262: ECMAScript language conformance — guards against QuickJS-ng
  # patch regressions that would reduce JS syntax/API support.
  # ============================================================================
  test262:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: test262 (ES conformance)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      # 上游 quickjs-ng 的 .gitmodules 对嵌套 test262 子模块设了
      # submodule.test262.update=none（tc39/test262 体量大，上游默认跳过），
      # 因此上面的 recursive checkout 会打印 "Skipping submodule
      # 'deps/quickjs-ng/test262'"，语料目录缺失，run-test262 报
      # "test262/test: No such file or directory"。显式覆盖 update 并定向
      # shallow 拉取（对齐上游 shallow=true）。
      - name: Fetch test262 corpus (upstream sets update=none)
        run: |
          git -C deps/quickjs-ng config submodule.test262.update checkout
          git -C deps/quickjs-ng submodule update --init --depth 1 test262

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (test262 conformance)
        run: |
          cd build && ctest -L test262 --output-on-failure
          # Engine-level ES conformance (quickjs-ng run-test262, corpus from the
          # test262 submodule fetched by the step above).

  # ============================================================================
  # clang-tidy: static analysis.
  # ============================================================================
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: clang-tidy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build clang-tidy

      - name: Install Node (polyfill toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install polyfill deps (esbuild)
        run: npm --prefix polyfill ci
      - name: Configure (clang-tidy)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQZ_BUILD_TESTS=ON \
            -DCLANG_TIDY_EXE=clang-tidy \
            -DQZ_RUN_CLANG_TIDY=ON

      - name: Build (with clang-tidy)
        run: cmake --build build --parallel

  # ============================================================================
  # fuzz-smoke: libFuzzer smoke run over the QuickJS bytecode deserializer
  # (JS_ReadObject with JS_READ_OBJ_BYTECODE) — the loader path qzjs uses for
  # the embedded polyfill and the worker boot shims, i.e. parse of bytes that
  # do not come from the trusted build. Corpus-less 60 s smoke: it is a crash
  # gate (ASan), not a proof of safety. There is no in-tree fuzz harness of
  # our own yet (only the vendored lz4/mbedtls ones), so the harness is
  # generated inline here; promote it to fuzz/ if this job earns its keep.
  # ============================================================================
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: fuzz-smoke (libFuzzer bytecode reader)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ccache-setup

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ninja-build clang

      # 不装 polyfill 工具链：字节码是 qzjs target 的依赖而非 configure 前提，
      # polyfill 工具链 gate 已下沉到 build 期（CMake else 分支）。本 job 只构建
      # 插桩 qjs（不构建 qzjs），字节码用不到，不该被工具链 gate 误伤。

      - name: Configure (clang, fuzzer + ASan instrumentation)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address -g -O1"

      - name: Build quickjs-ng (instrumented)
        run: cmake --build build --target qjs --parallel

      # 注：本 job 只构建插桩的 qjs（不构建 qzjs），不跑 polyfill 工具链，因此
      # 没有内嵌字节码可用来生成「字节码前缀」种子（那些种子已随字节码改为构建
      # 产物，见 test/gen_fuzz_seeds.py）。此处语料为 committed 的 crash/oom 回归
      # 种子——它们是真实发现过的崩溃/OOM 输入，与字节码无关，仍是有效语料。
      # 真实字节码结构的变异起点由构建 qzjs 的 job 侧（fuzz_seeds_gen）覆盖。

      - name: Build harness (inline, links the instrumented libqjs.a)
        run: |
          cat > fuzz_bc.c <<'EOF'
          /* Minimal libFuzzer harness: feeds arbitrary bytes to the QuickJS
           * bytecode deserializer (JS_ReadObject + JS_READ_OBJ_BYTECODE) — the
           * parse qzjs performs on the embedded polyfill (src/context.c) and
           * on worker boot shims (src/qzjs.c). Read-only: the resulting value
           * is freed, never evaluated. */
          #include <stddef.h>
          #include <stdint.h>
          #include "quickjs.h"

          int LLVMFuzzerTestOneInput(const uint8_t *data, size_t size)
          {
              JSRuntime *rt = JS_NewRuntime();
              if (!rt)
                  return 0;
              JSContext *ctx = JS_NewContext(rt);
              if (ctx) {
                  JSValue val = JS_ReadObject(ctx, data, size, JS_READ_OBJ_BYTECODE);
                  JS_FreeValue(ctx, val);
                  JS_FreeContext(ctx);
              }
              JS_FreeRuntime(rt);
              return 0;
          }
          EOF
          clang -O1 -g -fsanitize=fuzzer,address \
            -I deps/quickjs-ng \
            fuzz_bc.c build/deps/quickjs-ng/libqjs.a \
            -lm -lpthread -ldl \
            -o fuzz_bc

      - name: Replay seed corpus (regression gate — every seed must parse clean)
        env:
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
        run: |
          # Every seed is a known input (real bytecode heads, historical
          # crash/OOM repros). A failure here means the bc-reader hardening
          # regressed — fail the job before the fuzz step even starts.
          for seed in test/fuzz-corpus/*; do
            echo "--- $seed"
            ./fuzz_bc "$seed"
          done

      - name: Fuzz (60 s, seeded from the corpus)
        env:
          # ASan's shadows make the process start at ~2 GB RSS, and LSan does
          # not work under the runner's tracing — hence the raised limit and
          # the leak check off. Neither weakens crash/UB detection.
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
        # Seeded run: libFuzzer starts from the corpus (real bytecode
        # structure + past crashers) instead of scratch, so the 60 s budget
        # spends its time mutating around known-interesting shapes rather
        # than rediscovering the container format from scratch. New crashing
        # inputs land in the working dir; promote interesting ones into
        # test/fuzz-corpus/ as seeds.
        run: |
          mkdir -p corpus-out
          ./fuzz_bc -max_total_time=60 -rss_limit_mb=4096 -timeout=25 \
            -print_final_stats=1 test/fuzz-corpus corpus-out