name: AOT performance matrix

# 性能测量协议（brain aot-roadmap, 2026-11-25）：
# wasm-JIT 与 wasm-AOT 必须分别测，每档都要同时与 qzjs 纯解释和 node 比较。
# 本机 12 核长期满载，性能数字只在这里产；CI runner = host 校准，不是真机验收。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'   # 每周日 18:00 UTC

permissions:
  contents: read

jobs:
  aot-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build + perf dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            clang lld zlib1g-dev wasi-libc curl

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: |
          npm --prefix src/polyfill ci
          npm --prefix src/qzvm/aot ci

      # WAMR 自带 CMake 不认系统 LLVM_DIR，只认 core/deps/llvm/build；现成 CI job
      # (aot-perf-baseline) 已验证预编译包路径，沿用同一固定版本。
      - name: Install wamrc 2.4.5 (prebuilt)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wamrc-2.4.5
          curl -fsSL --retry 3 --connect-timeout 20 \
            -o /tmp/wamrc-2.4.5.tar.gz \
            https://github.com/wasm-micro-runtime/wasm-micro-runtime/releases/download/WAMR-2.4.5/wamrc-2.4.5-x86_64-ubuntu-22.04.tar.gz
          tar -xzf /tmp/wamrc-2.4.5.tar.gz -C /tmp/wamrc-2.4.5
          WAMRC=$(find /tmp/wamrc-2.4.5 -type f -name wamrc -print -quit)
          test -n "$WAMRC"
          chmod +x "$WAMRC"
          "$WAMRC" --version
          echo "$WAMRC" > /tmp/wamrc-path
          cp "$WAMRC" /tmp/wamrc

      - name: Build qzjs Release (with WAMR)
        run: |
          cmake -S . -B build-rel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF
          cmake --build build-rel --parallel

      - name: Build in-module guest (libqzvm.wasm)
        run: |
          cmake -S . -B build-inmod -G Ninja \
            -DQZ_PROFILE=in-module \
            -DCMAKE_TOOLCHAIN_FILE=cmake/wasm32.cmake
          cmake --build build-inmod --target qzvm-guest --parallel

      # Ubuntu 的 binaryen 包不含 wasm-merge；用 release 预编译包（与 wamrc 同法）。
      - name: Install wasm-merge (binaryen release)
        run: |
          set -euo pipefail
          mkdir -p /tmp/binaryen
          curl -fsSL --retry 3 --connect-timeout 20 \
            -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp/binaryen --strip-components=1
          M=$(find /tmp/binaryen -type f -name wasm-merge -print -quit)
          test -n "$M"
          chmod +x "$M"
          "$M" --version
          echo "WASM_MERGE=$M" >> "$GITHUB_ENV"

      # wasm2c：系统 wabt 1.0.27 在带 import 的模块上崩溃；用 1.0.42 预编译包。
      - name: Install wabt 1.0.42 (wasm2c for no-wasm-runtime tier)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wabt142
          curl -fsSL --retry 3 --connect-timeout 20 \
            -o /tmp/wabt142.tar.gz \
            https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          tar -xzf /tmp/wabt142.tar.gz -C /tmp/wabt142 --strip-components=1
          /tmp/wabt142/bin/wasm2c --version

      - name: Record runner environment
        run: |
          {
            echo "=== lscpu ==="; lscpu | head -25
            echo "=== node ==="; node --version
            echo "=== wamrc ==="; /tmp/wamrc --version 2>&1 || true
            echo "=== wasm-merge ==="; "$WASM_MERGE" --version 2>&1 || true
            echo "=== wasm2c ==="; /tmp/wabt142/bin/wasm2c --version 2>&1 || true
          } | tee perf-runner.txt

      - name: Tier A — qzjs-interp / node-JS / wasm-interp / wasm-AOT
        env:
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          WAMRC: /tmp/wamrc
          WASM_MERGE: ${{ env.WASM_MERGE }}
          LIBQZVM: ${{ github.workspace }}/build-inmod/src/qzvm/libqzvm.wasm
        run: node bench/aot-product/run_wamr.js 2>&1 | tee perf-wamr.txt

      # 复用可行性：M6b 合并单模块（emitter 产品 + libqzvm.wasm）经 wasm2c → C，
      # 验证 qzvm 已有的 qz.* C 宿主能否整体复用，而不是重写一份宿主。
      - name: Tier F — wasm2c of merged qzvm module (reuse feasibility, no perf)
        env:
          WABT_DIR: /tmp/wabt142
          MERGED: /tmp/aotp_merged.wasm
        run: |
          set -euo pipefail
          node bench/aot-product/run_wasm2c_full.mjs 2>&1 | tee perf-wasm2c-full.txt

      # 字节码拆分可行性：真实 qzjs bytecode 的纯数值 opcode 区间 → wasm，尾部留 qzjs 解释。
      - name: Tier G — bytecode split (equivalence + perf)
        env:
          MEASURE: "1"
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          WAMRC: /tmp/wamrc
          OUT: ${{ github.workspace }}/build/aot/bytecode-split
        run: |
          set -euo pipefail
          node bench/bytecode-aot/bytecode-split.mjs 2>&1 | tee perf-bytecode-split.txt

      # TS/ES2023 直接加速矩阵：带类型标注的 TS 源码 → 字节码拆分 → wasm AOT。
      - name: Tier H — TS/ES2023 direct acceleration matrix
        env:
          MEASURE: "1"
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          QJSC: ${{ github.workspace }}/build-rel/deps/quickjs-ng/qjsc
          WAMRC: /tmp/wamrc
          OUT: ${{ github.workspace }}/build/aot/ts-direct
        run: |
          set -euo pipefail
          node bench/bytecode-aot/ts-direct.mjs 2>&1 | tee perf-ts-direct.txt

      - name: Tier B — wasm-JIT (node WebAssembly / V8 TurboFan)
        env:
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          WASM_MERGE: ${{ env.WASM_MERGE }}
        run: node bench/aot-product/run_inmod.mjs --merge 2>&1 | tee perf-jit.txt

      - name: Tier C - wasm2c (wasm to C via gcc -O3, no wasm runtime)
        env:
          WABT_DIR: /tmp/wabt142
          WAMRC: /tmp/wamrc
        run: node bench/aot-product/run_wasm2c.mjs 2>&1 | tee perf-wasm2c.txt

      # polyfill AOT 加速：同一 hpack varint 算法，JS vs wamrc AOT vs wasm2c native ext。
      - name: Tier D — AOT accelerating qzjs polyfill
        env:
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          WAMRC: /tmp/wamrc
        run: node bench/aot-product/run_polyfill.js 2>&1 | tee perf-polyfill.txt

      # wasm2c 加速 polyfill：wasm → C → 编译期扩展(qz_ext_t) 编进 qzjs。
      - name: Generate wasm2c polyfill extension sources
        env:
          WABT_DIR: /tmp/wabt142
          WASM2C_OUT: ${{ github.workspace }}/build/aot/wasm2c-polyfill
        run: node bench/aot-product/run_wasm2c_polyfill.mjs 2>&1 | tee perf-w2c-polyfill-gen.txt

      - name: Build qzjs with wasm2c polyfill extension
        run: |
          set -euo pipefail
          CFG=$(cat build/aot/wasm2c-polyfill/build-config.json)
          SRC=$(echo "$CFG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["QZ_EXTRA_SOURCES"])')
          HDR=$(echo "$CFG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["QZ_EXTRA_HEADERS"])')
          CFLAGS=$(echo "$CFG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["CFLAGS"])')
          cmake -B build-w2c-poly -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQZ_BUILD_TESTS=OFF \
            -DQZ_EXTRA_SOURCES="$SRC" \
            -DQZ_EXTRA_HEADERS="$HDR" \
            -DQZ_EXTRA_CFLAGS="$CFLAGS" \
            -DQZ_EXTENSIONS='QZ_DEFAULT_EXTENSIONS &w2c_polyfill_ext'
          cmake --build build-w2c-poly --target qzjs --parallel
          test "$(./build-w2c-poly/qzjs -e 'console.log(typeof polyfillBatch)')" = "function"

      - name: Tier E — wasm2c native extension accelerating polyfill
        env:
          QZJS: ${{ github.workspace }}/build-rel/qzjs
          QZJS_W2C: ${{ github.workspace }}/build-w2c-poly/qzjs
          WAMRC: /tmp/wamrc
        run: |
          set -euo pipefail
          node bench/aot-product/run_polyfill_all.js 2>&1 | tee perf-polyfill-all.txt

      - name: Verify all tiers produced data
        run: |
          grep -q 'qzjs-interp' perf-wamr.txt
          grep -q 'node-JS' perf-wamr.txt
          grep -q 'WAMR-AOT' perf-wamr.txt
          if grep -q 'wamrc failed\|no RESULT\|wamrc FAIL' perf-wamr.txt perf-jit.txt perf-polyfill.txt; then
            echo 'AOT tier missing — check wamrc'; exit 1
          fi
          grep -q 'computeWork' perf-jit.txt
          grep -q 'p50_ms=' perf-wasm2c.txt
          grep -q 'COMPILE_OK' perf-wasm2c-full.txt
          grep -q 'EQUIVALENCE PASS' perf-bytecode-split.txt
          grep -q 'wasm + bytecode tail' perf-bytecode-split.txt
          grep -qE 'summary: [1-9][0-9]* PASS' perf-ts-direct.txt
          grep -q 'speedup p50' perf-polyfill.txt
          grep -q 'check 一致: true' perf-polyfill.txt || { echo 'polyfill check mismatch'; exit 1; }
          grep -q 'baseline JS .*p50_ms' perf-polyfill-all.txt
          grep -q 'wamrc AOT .*p50_ms' perf-polyfill-all.txt
          grep -q 'wasm2c native ext .*p50_ms' perf-polyfill-all.txt
          ! grep -q 'N/A' perf-polyfill-all.txt
          grep -q 'check 一致: true' perf-polyfill-all.txt || { echo 'wasm2c polyfill check mismatch'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: aot-perf-matrix
          path: |
            perf-runner.txt
            perf-wamr.txt
            perf-jit.txt
            perf-wasm2c.txt
            perf-wasm2c-full.txt
            perf-bytecode-split.txt
            perf-ts-direct.txt
            perf-polyfill.txt
            perf-w2c-polyfill-gen.txt
            perf-polyfill-all.txt
